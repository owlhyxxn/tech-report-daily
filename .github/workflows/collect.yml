name: collect

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: prepare
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach store FETCH_HEAD
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git worktree add --detach store
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - id: collect
        run: python -m collector.collect --sources sources.yml --data store/data

      - if: steps.collect.outputs.new_count != '0' || steps.collect.outputs.deleted_count != '0' || steps.prepare.outputs.created == 'true'
        working-directory: store
        env:
          NEW_COUNT: ${{ steps.collect.outputs.new_count }}
          DELETED_COUNT: ${{ steps.collect.outputs.deleted_count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git rm -rfq --cached .
          git add -A data
          git commit -m "data snapshot $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') (+${NEW_COUNT} items, -${DELETED_COUNT} files)"
          git push --force origin HEAD:refs/heads/data
