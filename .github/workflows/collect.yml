name: collect

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: collect
        run: python -m collector.collect --sources sources.yml --data data

      - if: steps.collect.outputs.new_count != '0' || steps.collect.outputs.deleted_count != '0'
        env:
          NEW_COUNT: ${{ steps.collect.outputs.new_count }}
          DELETED_COUNT: ${{ steps.collect.outputs.deleted_count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: +${NEW_COUNT} items, -${DELETED_COUNT} files ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          exit 1
